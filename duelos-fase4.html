<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash Royale - Duelos Fase 4 Semifinal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-[#0a0f1d] text-slate-100 font-sans min-h-screen p-6">

    <div class="max-w-6xl mx-auto">
        <!-- Encabezado -->
        <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-8 pb-4 border-b border-cyan-500/30">
            <div>
                <span class="text-xs font-bold font-orbitron px-2.5 py-1 bg-amber-500/20 text-amber-400 border border-amber-500/40 rounded uppercase">
                    Fase 4: Semifinal (4 Jugadores)
                </span>
                <h1 class="text-3xl font-orbitron font-black text-[#00d2ff] mt-2">
                    <i class="fa-solid fa-gamepad mr-2"></i>DISTRIBUCIÓN DE ENFRENTAMIENTOS F4
                </h1>
            </div>
            
            <div class="flex gap-2">
                <!-- Exportar -->
                <button id="btn-exportar-duelos" class="bg-slate-800 border border-slate-700 hover:border-cyan-500/50 text-slate-300 font-orbitron font-bold px-4 py-2.5 rounded-xl flex items-center gap-2 transition-all text-xs cursor-pointer">
                    <i class="fa-solid fa-download text-cyan-400"></i> Exportar Duelos
                </button>
            
                <!-- Importar -->
                <label for="input-importar-duelos" class="bg-slate-800 border border-slate-700 hover:border-emerald-500/50 text-slate-300 font-orbitron font-bold px-4 py-2.5 rounded-xl flex items-center gap-2 transition-all text-xs cursor-pointer">
                    <i class="fa-solid fa-upload text-emerald-400"></i> Cargar Duelos
                    <input type="file" id="input-importar-duelos" accept=".json" class="hidden">
                </label>
            
                <!-- Sorteo Inicial -->
                <button id="btn-sortear" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-900 font-orbitron font-bold px-5 py-2.5 rounded-xl shadow-[0_0_15px_rgba(0,210,255,0.4)] flex items-center gap-2 transition-all cursor-pointer">
                    <i class="fa-solid fa-dice text-lg"></i> Realizar Sorteo Inicial
                </button>
            </div>
        </div>

        <!-- Tarjetas Estáticas de Sorteo Inicial -->
        <div id="contenedor-duelos" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8"></div>

        <!-- CONTROL INTERACTIVO DE MESAS FASE 4 -->
        <div id="seccion-carrusel" class="hidden border-t border-cyan-500/30 pt-8 mt-4">
            <h2 class="text-2xl font-orbitron font-black text-emerald-400 mb-4">
                <i class="fa-solid fa-rotate"></i> CONTROL INTERACTIVO DE MESAS (3 RONDAS)
            </h2>
            
            <!-- PANEL DE RONDA -->
            <div class="flex flex-col md:flex-row items-center justify-between bg-[#121a2d]/80 border border-emerald-500/30 rounded-xl p-4 mb-4 shadow-lg">
                <span id="badge-ronda" class="text-lg font-orbitron font-bold text-amber-400 uppercase tracking-widest">
                    RONDA 1 DE 3
                </span>
                <button id="btn-siguiente-ronda" class="bg-emerald-500/20 hover:bg-emerald-500 text-emerald-400 hover:text-white border border-emerald-500/50 font-orbitron font-bold px-4 py-2 rounded-lg transition-all flex items-center gap-2 mt-4 md:mt-0">
                    Siguiente Ronda <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>

            <!-- CONTENEDOR DE LAS 2 MESAS -->
            <div id="contenedor-carrusel" class="grid grid-cols-1 md:grid-cols-2 gap-4 pb-12"></div>
        </div>
    </div>

    <script type="module" src="clashito/duelos4-controller.js"></script>
</body>
</html>
