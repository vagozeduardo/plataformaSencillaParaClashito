<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash Royale - Distribución de Duelos F3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-[#0a0f1d] text-slate-100 font-sans min-h-screen p-6">

    <div class="max-w-6xl mx-auto">
        <!-- Encabezado -->
        <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-8 pb-4 border-b border-cyan-500/30">
            <div>
                <span class="text-xs font-bold font-orbitron px-2.5 py-1 bg-amber-500/20 text-amber-400 border border-amber-500/40 rounded uppercase">
                    Fase 3: Modo Dios
                </span>
                <h1 class="text-3xl font-orbitron font-black text-[#00d2ff] mt-2">
                    <i class="fa-solid fa-gamepad mr-2"></i>DISTRIBUCIÓN DE ENFRENTAMIENTOS
                </h1>
            </div>
            
            <button id="btn-sortear" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-900 font-orbitron font-bold px-5 py-2.5 rounded-xl shadow-[0_0_15px_rgba(0,210,255,0.4)] flex items-center gap-2 transition-all">
                <i class="fa-solid fa-dice text-lg"></i> Realizar Sorteo Aleatorio
            </button>
        </div>

        <!-- Yacimiento de Tarjetas Duelos -->
        <div id="contenedor-duelos" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Las tarjetas VS se inyectarán por JavaScript -->
        </div>
    </div>

    <script type="module" src="clashito/duelos-controller.js"></script>
</body>
</html>
