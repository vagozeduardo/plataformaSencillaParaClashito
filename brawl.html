<!DOCTYPE html>
<html lang="es" class="dark tema-brawl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars - Fases del Torneo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="temas/brawl.css">
</head>
<body class="bg-[#0a0f1d] font-rajdhani min-h-screen flex flex-col">

    <!-- HEADER / MENÚ COMPARTIDO -->
    <header class="border-b border-cyan-500/20 bg-[#121a2d]/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-[#00d2ff]/20 flex items-center justify-center border border-[#00d2ff] neon-border-blue overflow-hidden">
                    <img src="media/juegos.png" alt="Logo de la mascota" class="w-full h-full object-cover">
                </div>
                <h1 class="font-orbitron text-xl md:text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-[#00d2ff] to-[#ff2a85]">
                    Torneo de videojuegos
                </h1>
            </a>
            <nav class="hidden md:flex items-center gap-6 text-sm font-semibold uppercase tracking-wider text-slate-300">
                <a href="index.html" class="hover:text-[#00d2ff] flex items-center gap-2"><i class="fa-solid fa-house"></i> Inicio</a>
                <a href="juegos.html" class="hover:text-[#00d2ff] flex items-center gap-2"><i class="fa-solid fa-gamepad"></i> Juegos</a>
                <a href="registro.html" class="hover:text-[#00d2ff] flex items-center gap-2"><i class="fa-solid fa-user-plus"></i> Registro</a>
            </nav>
            <a href="fases.html" class="btn-juego btn-primario bg-gradient-to-r from-[#00d2ff] to-[#2563eb] hover:from-cyan-400 hover:to-blue-600 text-slate-900 font-bold px-4 py-2 rounded-lg font-orbitron text-xs tracking-wider shadow-lg">
                <i class="fa-solid fa-trophy mr-1"></i> VER TORNEOS
            </a>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL: BRAWL STARS -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">

        <!-- Título del Juego y Modalidad -->
        <div class="flex items-center justify-between gap-4 mb-8">
            <div>
                <span class="text-xs font-bold font-orbitron px-2.5 py-1 bg-[#ff2a85]/20 text-[#ff2a85] border border-[#ff2a85]/40 rounded uppercase">
                    Modalidad 3v3 (Por Equipos)
                </span>
                <h2 class="font-orbitron text-3xl md:text-4xl font-black mt-2 text-slate-100 uppercase">
                    Torneo <span class="text-[#ff2a85] neon-text-pink">Brawl Stars</span>
                </h2>
            </div>
            <div class="flex items-center gap-2 md:gap-4">
                <a href="config-fases.html?juego=bs" class="btn-juego btn-secundario flex items-center gap-2 bg-slate-800 border border-slate-700 hover:border-[#ff2a85]/50 text-slate-300 px-3 py-2 rounded-lg text-xs font-orbitron font-bold transition-all" title="Agregar, quitar o editar fases y modos">
                    <i class="fa-solid fa-sliders text-[#ff2a85]"></i> <span class="hidden sm:inline">Configurar Fases</span>
                </a>
                <button id="btn-reiniciar" class="btn-juego btn-peligro flex items-center gap-2 bg-slate-800 border border-slate-700 hover:border-rose-500/50 text-slate-300 px-3 py-2 rounded-lg text-xs font-orbitron font-bold transition-all" title="Reiniciar fases o torneo">
                    <i class="fa-solid fa-power-off text-rose-400"></i> <span class="hidden sm:inline">Reiniciar</span>
                </button>
                <img src="media/emblemas/brawl-emblema.svg" alt="Emblema de Brawl Stars" class="emblema w-14 h-14 md:w-[4.5rem] md:h-[4.5rem] shrink-0">
            </div>
        </div>

        <!-- CONTENEDOR DE FASES -->
        <div class="bg-[#121a2d] rounded-2xl border border-slate-800 shadow-xl overflow-hidden">

            <!-- 1. Pestañas (generadas desde brawl/brawl-config.js o config-fases.html?juego=bs) -->
            <div id="tabs-fases" class="flex overflow-x-auto border-b border-slate-800 bg-slate-900/50 custom-scrollbar-pink"></div>

            <!-- 2. Cabecera de la Fase Actual -->
            <div class="p-4 md:p-6 bg-[#121a2d]">
                <div class="flex flex-col md:flex-row md:items-start justify-between gap-4 mb-6">
                    <div>
                        <h3 id="titulo-fase" class="font-orbitron text-xl font-bold text-slate-100"></h3>
                        <p id="desc-fase" class="text-slate-400 text-sm"></p>
                        <!-- Modos de juego de la fase -->
                        <div id="modos-fase" class="flex flex-wrap gap-2 mt-3"></div>
                    </div>

                    <div class="flex flex-wrap items-center gap-3 md:justify-end shrink-0">
                        <button id="btn-sortear" class="btn-juego btn-aviso hidden flex items-center justify-center gap-2 bg-[#ff2a85]/20 border border-[#ff2a85]/50 text-[#ff2a85] px-4 py-2 rounded-lg text-sm font-bold hover:bg-[#ff2a85]/30 transition-colors"></button>

                        <button id="btn-avanzar-fase" class="btn-juego btn-primario flex items-center justify-center gap-2 bg-gradient-to-r from-emerald-500 to-teal-600 text-slate-900 font-bold px-4 py-2 rounded-lg text-sm transition-all shadow-md">
                            <i class="fa-solid fa-forward font-bold"></i> Avanzar de Fase
                        </button>

                        <button id="btn-filtrar" class="btn-juego btn-secundario flex items-center justify-center gap-2 bg-slate-800 border border-slate-700 text-slate-300 px-4 py-2 rounded-lg text-sm font-bold hover:bg-slate-700 transition-colors">
                            <i class="fa-solid fa-filter"></i> Ocultar Eliminados
                        </button>
                    </div>
                </div>

                <!-- 3. Grupos / cruces / tabla (generados por JS) -->
                <div id="contenido-fase" class="grid md:grid-cols-2 gap-8 max-h-[600px] overflow-y-auto custom-scrollbar-pink pr-2"></div>
            </div>
        </div>
    </main>

    <script type="module" src="brawl/brawl.js"></script>
</body>
</html>
