<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneo de videojuegos - Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="temas/clash.css">
    <link rel="stylesheet" href="temas/brawl.css">
    <link rel="stylesheet" href="temas/inicio.css">
</head>
<body class="portada min-h-screen flex flex-col">

    <!-- MENÚ (mismo que la portada) -->
    <header class="portada-header sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <a href="index.html" class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 shrink-0 rounded-full flex items-center justify-center border-2 border-black bg-[#ffd400] overflow-hidden">
                    <img src="media/juegos.png" alt="Logo del torneo" class="w-full h-full object-cover">
                </div>
                <span class="marca text-xl md:text-2xl truncate">Torneo de videojuegos</span>
            </a>
            <nav class="portada-nav flex items-center gap-4 md:gap-6 text-sm uppercase text-slate-200">
                <a href="juegos.html" class="flex items-center gap-2"><i class="fa-solid fa-gamepad text-[#3ee0ff]"></i> Juegos</a>
                <a href="clash.html" class="hidden sm:flex items-center gap-2"><i class="fa-solid fa-crown text-[#ffc933]"></i> Clash</a>
                <a href="brawl.html" class="hidden sm:flex items-center gap-2"><i class="fa-solid fa-star text-[#ffd400]"></i> Brawl</a>
                <a href="registro.html" class="activo flex items-center gap-2"><i class="fa-solid fa-user-plus text-[#ff1f8f]"></i> Registro</a>
            </nav>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-10 md:py-12 flex-grow w-full">
        <div class="text-center mb-8">
            <h1 class="titulo-portada text-4xl md:text-6xl uppercase text-white">Inscripción</h1>
            <p class="mt-3 text-slate-300 font-bold">Primero elige el torneo en el que quieres competir.</p>
        </div>

        <!-- 1. SELECTOR DE JUEGO -->
        <div class="grid grid-cols-2 gap-4 md:gap-6 mb-10" role="radiogroup" aria-label="Torneo">
            <button type="button" data-juego="cr" role="radio" class="selector-juego tarjeta-juego tema-clash p-4 md:p-5 flex flex-col sm:flex-row items-center gap-3 text-center sm:text-left">
                <img src="media/emblemas/clash-emblema.svg" alt="" class="w-14 h-16 shrink-0">
                <span>
                    <span class="nombre-juego block text-lg md:text-xl uppercase leading-tight">Clash Royale</span>
                    <span class="block text-[#cfe0ff] text-xs font-extrabold uppercase tracking-wider mt-1">1 vs 1 · Individual</span>
                </span>
            </button>
            <button type="button" data-juego="bs" role="radio" class="selector-juego tarjeta-juego tema-brawl p-4 md:p-5 flex flex-col sm:flex-row items-center gap-3 text-center sm:text-left">
                <img src="media/emblemas/brawl-emblema.svg" alt="" class="w-14 h-14 shrink-0">
                <span>
                    <span class="nombre-juego block text-xl md:text-2xl uppercase leading-tight">Brawl Stars</span>
                    <span class="block text-[#ead9ff] text-xs font-extrabold uppercase tracking-wider mt-1">3 vs 3 · Por equipos</span>
                </span>
            </button>
        </div>

        <!-- 2. FORMULARIO (cambia de tema según el juego elegido) -->
        <section id="tarjeta-registro" class="tarjeta-juego tema-clash p-6 md:p-8">
            <div class="flex items-center gap-4 mb-6">
                <img id="registro-emblema" src="media/emblemas/clash-emblema.svg" alt="" class="w-16 h-[4.5rem] shrink-0">
                <div>
                    <h2 id="registro-titulo" class="nombre-juego text-2xl md:text-3xl uppercase leading-tight">Registro Clash Royale</h2>
                    <p id="registro-subtitulo" class="text-sm font-bold opacity-90 mt-1">Ingresa tus datos de jugador para unirte al torneo.</p>
                </div>
            </div>

            <form id="form-registro" class="space-y-4">
                <div>
                    <label for="nombre" class="block text-xs font-extrabold uppercase tracking-wider text-slate-200 mb-1">Nombre</label>
                    <input type="text" id="nombre" autocomplete="name" placeholder="Ej. Hugo" class="w-full rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none">
                </div>
                <div>
                    <label for="gamertag" class="block text-xs font-extrabold uppercase tracking-wider text-slate-200 mb-1">GamerTag</label>
                    <input type="text" id="gamertag" placeholder="Ej. THETROOPER_JE" class="w-full rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none">
                </div>
                <div>
                    <label for="id_jugador" class="block text-xs font-extrabold uppercase tracking-wider text-slate-200 mb-1">ID Jugador (#TAG)</label>
                    <input type="text" id="id_jugador" placeholder="Ej. #UGLVUPVVQ" class="w-full rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none">
                </div>

                <!-- El selector visual de arriba controla este campo (lo usa registro.js) -->
                <select id="torneo_select" class="hidden" aria-hidden="true" tabindex="-1">
                    <option value="cr">Clash Royale (1v1)</option>
                    <option value="bs">Brawl Stars (3v3)</option>
                </select>

                <!-- EQUIPO (solo Brawl Stars) -->
                <div id="equipo_container" class="hidden pb-2">
                    <label for="equipo_input" class="block text-xs font-extrabold uppercase tracking-wider text-[#ffd400] mb-1">
                        <i class="fa-solid fa-users mr-1"></i> Nombre del equipo
                    </label>
                    <input type="text" list="lista_equipos" id="equipo_input" placeholder="Escribe para crear uno o elige uno existente" class="w-full rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none">
                    <datalist id="lista_equipos"></datalist>
                    <p class="text-[11px] text-slate-300 mt-1">Si el equipo no existe se crea automáticamente.</p>
                </div>

                <button type="submit" id="btn_submit" disabled class="btn-juego btn-primario w-full py-3 rounded-xl mt-4 text-base">
                    <i class="fa-solid fa-check mr-1"></i> <span id="texto-boton">Confirmar inscripción</span>
                </button>
            </form>
        </section>
    </main>

    <footer class="border-t-[3px] border-black bg-black/40 py-4 text-center text-xs text-slate-400 font-bold">
        Torneo de videojuegos · Comunidad de Sistemas
    </footer>

    <!-- LLAMADA AL ARCHIVO JAVASCRIPT EXTERNO -->
    <script src="registro.js"></script>
</body>
</html>
